name: ai_shopping_helper
description: "AI Shopping Helper - умный помощник для покупок"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # HTTP и работа с сетью
  http: ^1.2.1
  url_launcher: ^6.3.2

  # WebView для парсинга Ozon
  webview_flutter: ^4.8.0

  # Локальная БД для кэша и хочушек
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # Кэширование изображений (КРИТИЧНО для карточек товаров)
  cached_network_image: ^3.3.1

  # Форматирование цен и дат
  intl: ^0.19.0

  # Хранение настроек
  shared_preferences: ^2.5.5

  # Анимации
  confetti: ^0.7.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/mascot_thinking.png
    - assets/images/mascot_sad.png
    - assets/images/mascot_happy.png
    - assets/images/mascot_excited.png